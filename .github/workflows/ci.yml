name: CI

# Treat the agent as code: lint it, run the deterministic test suite behind a
# coverage gate, replay the deterministic (no-spend) skill-eval tier, and scan
# the staged tree for personal/financial files. No frontend, no Docker, no live
# eval — the agent runs via the stdio MCP server in a Claude Code session.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev group)
        run: uv sync --dev

      # The brand token block in src/local_budget/report/brand.py is a GENERATED region owned by the
      # `press` skill (github.com/natejswenson/claude-skills). Fails if it was
      # hand-edited, or if the shared tokens moved without re-emitting here, so
      # this repo can never silently drift from the brand every other product
      # renders from. Pinned, not @latest: a token change upstream should surface
      # as a failing check to be adopted deliberately, never land unreviewed.
      #   npx -y @natjswenson/press@0.8.0 emit --repo .
      - name: Brand tokens in sync (press)
        run: npx -y @natjswenson/press@0.8.0 check --repo .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests with coverage gate
        run: uv run pytest --cov=local_budget --cov-report=term-missing --cov-fail-under=80

      - name: Deterministic skill eval (mock tier — no spend)
        run: uv run python scripts/eval.py --mock

      - name: Secret scan (staged-tree denylist)
        run: bash scripts/secret-scan.sh
